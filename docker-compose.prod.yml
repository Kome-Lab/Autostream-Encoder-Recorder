services:
  encoder-recorder:
    image: ${AUTOSTREAM_IMAGE_REGISTRY:-ghcr.io/kome-lab/autostream-docker}/encoder-recorder:${AUTOSTREAM_DOCKER_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      AUTOSTREAM_ENV: production
      AUTOSTREAM_NODE_CONFIG: /etc/autostream-encoder-recorder/config.yml
      AUTOSTREAM_CONFIG_REVISION: ${AUTOSTREAM_CONFIG_REVISION:-1}
      AUTOSTREAM_BIND_ADDR: 0.0.0.0:${AUTOSTREAM_ENCODER_RECORDER_CONTAINER_PORT:-8080}
      # Direct YouTube Live API output is the default. Existing Relay
      # installations can opt in through the host .env file.
      AUTOSTREAM_OUTPUT_RELAY_URL: ${AUTOSTREAM_OUTPUT_RELAY_URL:-}
      AUTOSTREAM_OUTPUT_RELAY_MODE: ${AUTOSTREAM_OUTPUT_RELAY_MODE:-direct}
      AUTOSTREAM_REQUIRE_OUTPUT_RELAY: ${AUTOSTREAM_REQUIRE_OUTPUT_RELAY:-false}
      AUTOSTREAM_OUTPUT_RELAY_BINDING_ID: ${AUTOSTREAM_OUTPUT_RELAY_BINDING_ID:-}
      # Enables only this Compose-owned service DNS identity; it is not a
      # general remote relay allowlist.
      AUTOSTREAM_COMPOSE_OUTPUT_RELAY: "1"
    depends_on:
      output-relay:
        condition: service_started
    ports: !override
      - "127.0.0.1:${AUTOSTREAM_ENCODER_RECORDER_PORT:-8081}:${AUTOSTREAM_ENCODER_RECORDER_CONTAINER_PORT:-8080}"
    volumes:
      - ./config:/etc/autostream-encoder-recorder:ro
      - encoder-archives:/var/lib/autostream/archives
  output-relay:
    image: tiangolo/nginx-rtmp:latest
    restart: unless-stopped
    volumes:
      - ./relay/nginx-rtmp.conf:/etc/nginx/nginx.conf:ro

volumes:
  encoder-archives:
