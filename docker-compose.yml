services:
  encoder-recorder:
    build: .
    env_file: .env.example
    environment:
      AUTOSTREAM_NODE_CONFIG: /etc/autostream-encoder-recorder/config.yml
      CREDENTIALS_DIRECTORY: /run/autostream-credentials
    configs:
      - source: node-listener
        target: /run/autostream-credentials/node-listener.json
    ports:
      - "127.0.0.1:${AUTOSTREAM_ENCODER_RECORDER_PORT:-8081}:${AUTOSTREAM_ENCODER_RECORDER_CONTAINER_PORT:-8080}"
    volumes:
      - ./config:/etc/autostream-encoder-recorder

configs:
  node-listener:
    content: |
      {"schema_version":2,"service_type":"encoder_recorder","bind_address":"0.0.0.0:${AUTOSTREAM_ENCODER_RECORDER_CONTAINER_PORT:-8080}","config_revision":${AUTOSTREAM_CONFIG_REVISION:?AUTOSTREAM_CONFIG_REVISION is required}}
